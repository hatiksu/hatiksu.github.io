<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <meta name="description" content="Hatiksu — разработчик: веб-приложения, интерфейсы и интеграции с ИИ." />
    <meta property="og:title" content="Hatiksu — разработчик" />
    <meta property="og:description" content="Веб-приложения, интерфейсы и интеграции с ИИ." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <meta property="og:image" content="https://hatiksu.github.io/og/site.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты не блокируют первую отрисовку: подключаются после загрузки стилей -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>404 — Hatiksu</title>
    <script>
      // Тема до первой отрисовки, чтобы не было вспышки тёмного фона в светлой теме
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notfound.tsx"></script>
  </body>
</html>
