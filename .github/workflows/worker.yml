name: Deploy contact worker

# Публикует Cloudflare Worker формы «Написать мне» (папка worker/).
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Пока их нет, workflow пропускается с подсказкой. Подробности — worker/README.md.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/lib/contact.ts', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - name: Секреты не заданы
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Добавьте секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (см. worker/README.md)"
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_SECRETS == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
